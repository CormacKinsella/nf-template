[project]

authors = ["CormacKinsella <27350062+CormacKinsella@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
description = "Base pixi environment for Nextflow projects"
name = "nf-template"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]

linux="3.10"
libc="2.17"

[tasks]

dag = { cmd = "nextflow main.nf -preview -with-dag flowchart.png" }
test = { cmd = "nextflow main.nf --samplesheet './data/test/samplesheet.csv' --reference './data/test/genome.fa' -profile standard,apptainer" }

[dependencies]

nextflow=">=24.10.4"
apptainer=">=1.3.6"
graphviz=">=12.2.1"
